<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
</head>
<body>
  <div class="pin">
    <div class="pin-bg" style="background-image:url('{{ bg_url }}')"></div>
    <div class="pin-vignette"></div>
    <div class="pin-content">
      <div class="brand">{{ brand }}</div>
      <div class="eyebrow">{{ eyebrow }}</div>
      <div class="mood-grid">
        {% for tile in tiles %}
        <div class="mood-tile"><img src="{{ tile }}" alt="" /></div>
        {% endfor %}
      </div>
      <h1 class="title" style="margin-top:20px;font-size:72px">{{ hook }}</h1>
      <div class="cta">{{ cta }}</div>
      <div class="filter-line">{{ filter_line }}</div>
    </div>
  </div>
</body>
</html>
