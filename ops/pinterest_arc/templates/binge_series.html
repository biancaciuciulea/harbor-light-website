<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
</head>
<body>
  <div class="pin">
    <div class="pin-bg" style="background-image:url('{{ bg_url }}')"></div>
    <div class="pin-vignette"></div>
    <div class="pin-content">
      <div class="brand">{{ brand }}</div>
      <div class="eyebrow">{{ eyebrow }}</div>
      <h1 class="title">{{ title }}</h1>
      <div class="subtitle">{{ subtitle }}</div>
      <div class="series-row">
        {% for cover in covers %}
        <div class="cover-wrap"><img src="{{ cover }}" alt="" /></div>
        {% endfor %}
      </div>
      <div class="hook" style="margin-top:12px;margin-bottom:220px;text-align:center;width:100%">{{ hook }}</div>
      <div class="cta">{{ cta }}</div>
      <div class="filter-line">{{ filter_line }}</div>
    </div>
  </div>
</body>
</html>
