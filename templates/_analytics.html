{# One Google tag per page: GTM container loads gtm.js; GA4 measurement ID via gtag('config') #}
{% if site.gtm_id %}
<script async src="https://www.googletagmanager.com/gtm.js?id={{ site.gtm_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  {% if site.ga4_id %}gtag('config', '{{ site.ga4_id }}');{% endif %}
</script>
{% elif site.ga4_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga4_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.ga4_id }}');
</script>
{% endif %}
{% if site.gtm_id or site.ga4_id %}
<script defer src="{{ base_path | default('./') }}assets/ga-events.js"></script>
{% endif %}
{% if site.plausible_domain %}<script defer data-domain="{{ site.plausible_domain }}" src="https://plausible.io/js/script.js"></script>{% endif %}
